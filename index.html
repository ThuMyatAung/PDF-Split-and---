<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Splitter Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF-Lib for processing PDFs client-side -->
  <script src="https://unpkg.com/pdf-lib@1.17.9/dist/pdf-lib.min.js"></script>
  <!-- JSZip for bundling output files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">PDF Splitter</h1>
      <p class="text-sm text-slate-500 mt-1">300 MB အထိ PDF ဖိုင်များကို စာရွက်အရေအတွက်အလိုက် အလွယ်တကူ ခွဲထုတ်ပါ</p>
    </div>

    <!-- File Input -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-slate-700 mb-2">PDF ဖိုင် ရွေးချယ်ပါ</label>
      <input 
        type="file" 
        id="pdfInput" 
        accept="application/pdf"
        class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-xl"
      />
      <p id="fileInfo" class="text-xs text-slate-500 mt-1.5 hidden"></p>
    </div>

    <!-- Split Config -->
    <div class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">ဘယ်နှစ်ရွက် တစ်ခါ ခွဲထုတ်မလဲ (Pages per split)</label>
      <div class="flex items-center gap-3">
        <input 
          type="number" 
          id="pagesPerSplit" 
          value="5" 
          min="1"
          class="w-32 px-3 py-2 border border-slate-300 rounded-xl text-center font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <span class="text-sm text-slate-600">ရွက်စီ ခွဲထုတ်မည်</span>
      </div>
    </div>

    <!-- Action Button -->
    <button 
      id="splitBtn" 
      onclick="startSplitting()"
      class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all duration-150"
    >
      PDF စတင်ခွဲထုတ်မည်
    </button>

    <!-- Progress & Status -->
    <div id="progressContainer" class="mt-6 hidden">
      <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
        <span id="statusText">လုပ်ဆောင်နေသည်...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-150" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <script>
    const pdfInput = document.getElementById('pdfInput');
    const fileInfo = document.getElementById('fileInfo');
    const pagesPerSplit = document.getElementById('pagesPerSplit');
    const splitBtn = document.getElementById('splitBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const statusText = document.getElementById('statusText');

    pdfInput.addEventListener('change', () => {
      const file = pdfInput.files[0];
      if (file) {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        fileInfo.textContent = `ဖိုင်အမည်: ${file.name} | အရွယ်အစား: ${sizeMB} MB`;
        fileInfo.classList.remove('hidden');
      } else {
        fileInfo.classList.add('hidden');
      }
    });

    async function startSplitting() {
      const file = pdfInput.files[0];
      const chunkSize = parseInt(pagesPerSplit.value, 10);

      if (!file) {
        alert('ကျေးဇူးပြု၍ PDF ဖိုင်တစ်ခု အရင်ရွေးချယ်ပေးပါ။');
        return;
      }
      if (isNaN(chunkSize) || chunkSize < 1) {
        alert('ခွဲထုတ်မည့် စာရွက်အရေအတွက် အနည်းဆုံး ၁ ရွက် သတ်မှတ်ပေးပါ။');
        return;
      }

      // UI States Lock
      splitBtn.disabled = true;
      pdfInput.disabled = true;
      pagesPerSplit.disabled = true;
      progressContainer.classList.remove('hidden');

      try {
        updateProgress(5, 'ဖိုင်ကို ဖတ်ရှုနေပါသည် (ခေတ္တစောင့်ပါ)...');
        
        // Large files (300 MB): load ArrayBuffer
        const arrayBuffer = await file.arrayBuffer();
        
        updateProgress(20, 'PDF စာမျက်နှာများကို တွက်ချက်နေပါသည်...');
        const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        const totalPages = srcDoc.getPageCount();

        if (totalPages === 0) {
          throw new Error('PDF တွင် မည်သည့် စာမျက်နှာမှ မပါဝင်ပါ။');
        }

        const zip = new JSZip();
        let partIndex = 1;
        const totalParts = Math.ceil(totalPages / chunkSize);

        // Process in chunks with async break to prevent UI freezing
        for (let i = 0; i < totalPages; i += chunkSize) {
          const newDoc = await PDFLib.PDFDocument.create();
          
          const pageIndices = [];
          for (let j = i; j < Math.min(i + chunkSize, totalPages); j++) {
            pageIndices.push(j);
          }

          const copiedPages = await newDoc.copyPages(srcDoc, pageIndices);
          copiedPages.forEach(p => newDoc.addPage(p));

          const pdfBytes = await newDoc.save();
          const fileName = `split_part_${partIndex}_(pages_${i + 1}-${Math.min(i + chunkSize, totalPages)}).pdf`;
          zip.file(fileName, pdfBytes);

          // Update Progress Bar
          const progress = 20 + Math.floor(((partIndex) / totalParts) * 65);
          updateProgress(progress, `ဖိုင်ခွဲထုတ်နေသည်: အပိုင်း ${partIndex} / ${totalParts}`);

          partIndex++;

          // Allow the browser render thread to breathe (Crucial for 300MB handling)
          await new Promise(resolve => setTimeout(resolve, 0));
        }

        updateProgress(90, 'Zip ဖိုင် ချုံ့ထုတ်နေပါသည်...');
        const zipBlob = await zip.generateAsync({ type: 'blob' }, (metadata) => {
          const zipProgress = 90 + Math.floor(metadata.percent * 0.1);
          updateProgress(zipProgress, `Zip ထုတ်နေသည်: ${metadata.percent.toFixed(0)}%`);
        });

        // Trigger Auto-download
        updateProgress(100, 'ပြီးပါပြီ။ Download စတင်နေပါပြီ...');
        const downloadUrl = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `${file.name.replace(/\.[^/.]+$/, "")}_splits.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

      } catch (error) {
        console.error(error);
        alert('အမှားအယွင်း ဖြစ်ပေါ်ခဲ့သည်: ' + error.message);
        updateProgress(0, 'လုပ်ဆောင်မှု မအောင်မြင်ပါ');
      } finally {
        splitBtn.disabled = false;
        pdfInput.disabled = false;
        pagesPerSplit.disabled = false;
      }
    }

    function updateProgress(percent, text) {
      progressBar.style.width = `${percent}%`;
      progressPercent.textContent = `${percent}%`;
      statusText.textContent = text;
    }
  </script>
</body>
</html>
