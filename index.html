<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Splitter Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Stable Cloudflare CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.9/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">PDF Splitter</h1>
      <p class="text-sm text-slate-500 mt-1">300 MB အထိ PDF ဖိုင်များကို စိတ်ကြိုက်စာမျက်နှာအလိုက် ခွဲထုတ်ပါ</p>
    </div>

    <!-- File Input -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-slate-700 mb-2">PDF ဖိုင် ရွေးချယ်ပါ</label>
      <input 
        type="file" 
        id="pdfInput" 
        accept="application/pdf"
        class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-xl"
      />
      <p id="fileInfo" class="text-xs text-slate-500 mt-1.5 hidden"></p>
    </div>

    <!-- Split Mode Selection -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-slate-700 mb-2">ခွဲထုတ်မည့် ပုံစံရွေးပါ</label>
      <div class="grid grid-cols-2 gap-3">
        <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
          <input type="radio" name="splitMode" value="custom" checked onchange="toggleMode()" class="text-blue-600">
          <span class="text-xs font-medium text-slate-700">စိတ်ကြိုက်အပိုင်းအခြား (Ranges)</span>
        </label>
        <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
          <input type="radio" name="splitMode" value="fixed" onchange="toggleMode()" class="text-blue-600">
          <span class="text-xs font-medium text-slate-700">ပုံသေ စာရွက်ရေအလိုက်</span>
        </label>
      </div>
    </div>

    <!-- Mode 1: Custom Ranges Input -->
    <div id="customRangeSection" class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-1">စိတ်ကြိုက် စာမျက်နှာများ ရိုက်ထည့်ပါ</label>
      <p class="text-xs text-slate-500 mb-2">ကော်မာ (,) ခြားပြီး ရိုက်ပါ (ဥပမာ - <code>1-3, 5-8, 10</code> ဆိုပါက ဖိုင် ၃ ခု ခွဲပေးမည်)</p>
      <input 
        type="text" 
        id="customRangeInput" 
        placeholder="ဥပမာ: 1-5, 6-10, 12, 15-20" 
        class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Mode 2: Fixed Interval Input -->
    <div id="fixedIntervalSection" class="mb-6 hidden">
      <label class="block text-sm font-semibold text-slate-700 mb-2">ဘယ်နှစ်ရွက် တစ်ခါ ခွဲထုတ်မလဲ</label>
      <div class="flex items-center gap-3">
        <input 
          type="number" 
          id="pagesPerSplit" 
          value="5" 
          min="1"
          class="w-28 px-3 py-2 border border-slate-300 rounded-xl text-center font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <span class="text-sm text-slate-600">ရွက်စီ ခွဲထုတ်မည်</span>
      </div>
    </div>

    <!-- Action Button -->
    <button 
      id="splitBtn" 
      onclick="startSplitting()"
      class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all duration-150"
    >
      PDF စတင်ခွဲထုတ်မည်
    </button>

    <!-- Progress & Status -->
    <div id="progressContainer" class="mt-6 hidden">
      <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
        <span id="statusText">လုပ်ဆောင်နေသည်...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-150" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <script>
    const pdfInput = document.getElementById('pdfInput');
    const fileInfo = document.getElementById('fileInfo');
    const customRangeSection = document.getElementById('customRangeSection');
    const fixedIntervalSection = document.getElementById('fixedIntervalSection');
    const customRangeInput = document.getElementById('customRangeInput');
    const pagesPerSplit = document.getElementById('pagesPerSplit');
    const splitBtn = document.getElementById('splitBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const statusText = document.getElementById('statusText');

    let totalDocumentPages = 0;

    function toggleMode() {
      const mode = document.querySelector('input[name="splitMode"]:checked').value;
      if (mode === 'custom') {
        customRangeSection.classList.remove('hidden');
        fixedIntervalSection.classList.add('hidden');
      } else {
        customRangeSection.classList.add('hidden');
        fixedIntervalSection.classList.remove('hidden');
      }
    }

    pdfInput.addEventListener('change', () => {
      const file = pdfInput.files[0];
      if (file) {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        fileInfo.textContent = `ဖိုင်အမည်: ${file.name} | အရွယ်အစား: ${sizeMB} MB`;
        fileInfo.classList.remove('hidden');
      } else {
        fileInfo.classList.add('hidden');
      }
    });

    // Custom range parser: "1-3, 5, 8-10" => [[0, 1, 2], [4], [7, 8, 9]]
    function parseRanges(inputStr, maxPages) {
      const segments = inputStr.split(/[,;\s]+/).filter(Boolean);
      if (segments.length === 0) throw new Error('ခွဲထုတ်လိုသော စာမျက်နှာများကို ရိုက်ထည့်ပေးပါ။');

      const splitJobs = [];

      for (const seg of segments) {
        if (seg.includes('-')) {
          const parts = seg.split('-').map(s => s.trim());
          const start = parseInt(parts[0], 10);
          const end = parseInt(parts[1], 10);

          if (isNaN(start) || isNaN(end) || start < 1 || end < start) {
            throw new Error(`စာမျက်နှာ အပိုင်းအခြား မှားယွင်းနေပါသည်: "${seg}"`);
          }
          if (start > maxPages) {
            throw new Error(`စာမျက်နှာ ${start} သည် စုစုပေါင်းစာမျက်နှာ (${maxPages}) ထက် ကျော်လွန်နေပါသည်။`);
          }

          const pageIndices = [];
          for (let p = start; p <= Math.min(end, maxPages); p++) {
            pageIndices.push(p - 1);
          }
          splitJobs.push({ label: `pages_${start}-${Math.min(end, maxPages)}`, pages: pageIndices });
        } else {
          const p = parseInt(seg, 10);
          if (isNaN(p) || p < 1 || p > maxPages) {
            throw new Error(`မမှန်ကန်သော စာမျက်နှာနံပါတ် သို့မဟုတ် ကျော်လွန်နေပါသည်: "${seg}"`);
          }
          splitJobs.push({ label: `page_${p}`, pages: [p - 1] });
        }
      }
      return splitJobs;
    }

    async function startSplitting() {
      // Library verification check
      if (typeof PDFLib === 'undefined' || typeof JSZip === 'undefined') {
        alert('လိုအပ်သော Library များ ဒေါင်းလုဒ်မပြီးသေးပါ။ အင်တာနက်လိုင်း စစ်ဆေးပြီး Refresh လုပ်ပေးပါ။');
        return;
      }

      const file = pdfInput.files[0];
      if (!file) {
        alert('ကျေးဇူးပြု၍ PDF ဖိုင်တစ်ခု အရင်ရွေးချယ်ပေးပါ။');
        return;
      }

      splitBtn.disabled = true;
      pdfInput.disabled = true;
      progressContainer.classList.remove('hidden');

      try {
        updateProgress(5, 'ဖိုင်ကို ဖတ်ရှုနေပါသည် (ခေတ္တစောင့်ပါ)...');
        const arrayBuffer = await file.arrayBuffer();

        updateProgress(20, 'PDF စာမျက်နှာများကို စစ်ဆေးနေပါသည်...');
        const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        totalDocumentPages = srcDoc.getPageCount();

        if (totalDocumentPages === 0) {
          throw new Error('PDF တွင် စာမျက်နှာ မပါဝင်ပါ။');
        }

        const mode = document.querySelector('input[name="splitMode"]:checked').value;
        let splitJobs = [];

        if (mode === 'custom') {
          const rangeStr = customRangeInput.value.trim();
          splitJobs = parseRanges(rangeStr, totalDocumentPages);
        } else {
          const chunkSize = parseInt(pagesPerSplit.value, 10);
          if (isNaN(chunkSize) || chunkSize < 1) {
            throw new Error('စာရွက်အရေအတွက် အနည်းဆုံး ၁ ရွက် သတ်မှတ်ပေးပါ။');
          }
          for (let i = 0; i < totalDocumentPages; i += chunkSize) {
            const pages = [];
            for (let j = i; j < Math.min(i + chunkSize, totalDocumentPages); j++) {
              pages.push(j);
            }
            splitJobs.push({
              label: `pages_${i + 1}-${Math.min(i + chunkSize, totalDocumentPages)}`,
              pages: pages
            });
          }
        }

        const zip = new JSZip();
        const total = splitJobs.length;

        // Process PDF chunks
        for (let i = 0; i < total; i++) {
          const job = splitJobs[i];
          const newDoc = await PDFLib.PDFDocument.create();
          const copiedPages = await newDoc.copyPages(srcDoc, job.pages);
          copiedPages.forEach(p => newDoc.addPage(p));

          const pdfBytes = await newDoc.save();
          const fileName = `split_${i + 1}_(${job.label}).pdf`;
          zip.file(fileName, pdfBytes);

          const progress = 20 + Math.floor(((i + 1) / total) * 65);
          updateProgress(progress, `ဖိုင်ခွဲထုတ်နေသည်: ${i + 1} / ${total}`);

          // Non-blocking tick for 300MB buffer memory release
          await new Promise(resolve => setTimeout(resolve, 0));
        }

        updateProgress(90, 'Zip ဖိုင် ချုံ့ထုတ်နေပါသည်...');
        const zipBlob = await zip.generateAsync({ type: 'blob' }, (metadata) => {
          const zipProgress = 90 + Math.floor(metadata.percent * 0.1);
          updateProgress(zipProgress, `Zip ထုတ်နေသည်: ${metadata.percent.toFixed(0)}%`);
        });

        // Trigger Auto-download
        updateProgress(100, 'ပြီးပါပြီ။ Download စတင်နေပါပြီ...');
        const downloadUrl = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `${file.name.replace(/\.[^/.]+$/, "")}_splits.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

      } catch (error) {
        console.error(error);
        alert('အမှားအယွင်း ဖြစ်ပေါ်ခဲ့သည်: ' + error.message);
        updateProgress(0, 'လုပ်ဆောင်မှု မအောင်မြင်ပါ');
      } finally {
        splitBtn.disabled = false;
        pdfInput.disabled = false;
      }
    }

    function updateProgress(percent, text) {
      progressBar.style.width = `${percent}%`;
      progressPercent.textContent = `${percent}%`;
      statusText.textContent = text;
    }
  </script>
</body>
</html>
